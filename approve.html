<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AKSID IOU — Review &amp; Approve</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,Arial,sans-serif;background:#f4f6f9;color:#1d1d1f;font-size:14px}
.wrap{max-width:560px;margin:0 auto;padding:20px}
.logo{height:40px;margin-bottom:14px}
.card{background:#fff;border:1px solid #e6e8ec;border-radius:14px;padding:20px}
h1{font-size:18px;margin:0 0 2px}.sub{color:#6b6b70;font-size:12.5px;margin:0 0 16px}
.stagepill{display:inline-block;font-size:11px;font-weight:700;padding:3px 11px;border-radius:20px;color:#1c52c0;background:#e7efff;margin-bottom:14px}
.iouid{font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:700;color:#2a6df4}
label{display:block;font-size:12px;color:#6b6b70;font-weight:600;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid #d6dae1;border-radius:9px;background:#fff}
textarea{min-height:64px;resize:vertical}
.btnrow{display:flex;gap:10px;margin-top:18px}
button{flex:1;font:inherit;font-weight:700;border:none;border-radius:10px;padding:13px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.ok{background:#16a34a;color:#fff}.rej{background:#dc2626;color:#fff}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;font-size:13.5px;display:none}
.msg.good{background:#e6f4ea;color:#226b39;display:block}.msg.bad{background:#fdeced;color:#a3242e;display:block}
.muted{color:#9a9aa0;font-size:11.5px;margin-top:14px}.save{font-weight:700;color:#1d1d1f}
.done{display:none;text-align:center;padding:8px 0}
.done.on{display:block}
.done .t{font-size:17px;font-weight:700;margin-bottom:8px}
.backlink{display:inline-block;margin-top:12px;color:#2a6df4;font-weight:700;text-decoration:none;font-size:13px}
.warn{background:#fef4e6;color:#8a5a00;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="https://images.squarespace-cdn.com/content/v1/61b1d88771230e2244b14213/de522f80-4556-42c4-af20-e3687e746991/AKSID-HORIZONTAL-LOGO.png?format=750w" alt="AKSID" onerror="this.src='/aksid-logo.png'">
  <div class="card">
    <h1>Review &amp; Approve</h1>
    <p class="sub">AKSID Corporation Limited · IOU approval</p>

    <div id="formBox">
      <div id="ctx">
        <div class="stagepill" id="stageLbl">—</div>
        <div>IOU: <span class="iouid" id="iouLbl">—</span></div>
      </div>

      <div class="warn" id="noCtx" style="display:none">This link is missing details. Please open the approval link from your email again.</div>

      <label>Your Name *</label>
      <input id="approver" placeholder="Who is approving/rejecting?">

      <label>Approved Amount (BDT) *</label>
      <input id="amount" type="number" step="0.01" placeholder="0">
      <p class="muted" style="margin-top:4px">You may adjust the amount if only part of it is approved.</p>

      <label>Notes (optional — required if rejecting)</label>
      <textarea id="notes" placeholder="Any comment for the record…"></textarea>

      <div class="btnrow">
        <button class="ok" id="btnA" onclick="act('approve')">✓ Approve</button>
        <button class="rej" id="btnR" onclick="act('reject')">✕ Reject</button>
      </div>
      <div class="msg" id="msg"></div>
    </div>

    <div class="done" id="doneBox">
      <div class="t" id="doneTitle"></div>
      <div class="sub" id="doneSub" style="margin:0"></div>
      <a class="backlink" href="/">← Open tracker</a>
    </div>

    <p class="muted"><span class="save">DO NOT PRINT — SAVE PAPER.</span></p>
  </div>
</div>

<script>
const HOOK='https://hook.eu1.make.com/qynuydubdyor015k3ogwyacay2lwefu5';
const q=new URLSearchParams(location.search);
const id=q.get('id'), stage=q.get('stage'), iou=q.get('iou')||'', amt=q.get('amt')||'';
const STAGES={1:'Stage 1 of 4 · Concern Department Head',2:'Stage 2 of 4 · Audit',3:'Stage 3 of 4 · Accounts',4:'Stage 4 of 4 · Top Management or Others'};
const $=x=>document.getElementById(x);

if(!id||!stage){ $('noCtx').style.display='block'; $('btnA').disabled=true; $('btnR').disabled=true; }
$('stageLbl').textContent=STAGES[stage]||('Stage '+stage);
$('iouLbl').textContent=iou||('#'+id);
if(amt) $('amount').value=amt;

let busy=false;
async function act(action){
  if(busy) return;
  const m=$('msg');
  const approver=$('approver').value.trim();
  const amount=$('amount').value.trim();
  const notes=$('notes').value.trim();
  if(!approver){m.className='msg bad';m.textContent='Please enter your name.';return;}
  if(!amount||Number(amount)<=0){m.className='msg bad';m.textContent='Please enter a valid amount.';return;}
  if(action==='reject'&&!notes){m.className='msg bad';m.textContent='Please give a reason in Notes when rejecting.';return;}
  busy=true;$('btnA').disabled=true;$('btnR').disabled=true;
  m.className='msg';m.style.display='block';m.textContent='Submitting…';
  try{
    const r=await fetch(HOOK,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:id,action:action,stage:stage,amount:Number(amount),approver:approver,notes:notes})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    $('formBox').style.display='none';
    if(action==='approve'){
      $('doneTitle').textContent='✓ Approved';
      $('doneTitle').style.color='#226b39';
      $('doneSub').textContent='Your approval is being processed — the next stage will be notified automatically within a minute.';
    }else{
      $('doneTitle').textContent='✕ Rejected';
      $('doneTitle').style.color='#a3242e';
      $('doneSub').textContent='The rejection is being processed — the submitter will be notified automatically.';
    }
    $('doneBox').classList.add('on');
  }catch(e){
    busy=false;$('btnA').disabled=false;$('btnR').disabled=false;
    m.className='msg bad';m.textContent='Could not submit ('+e.message+'). Please try again.';
  }
}
</script>
</body>
</html>
